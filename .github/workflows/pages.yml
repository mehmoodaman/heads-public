
name: Publish Heads Website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate website
        env:
          HEADS_SUPPORT_EMAIL: ${{ vars.HEADS_SUPPORT_EMAIL }}
          HEADS_PUBLIC_OPERATOR: ${{ vars.HEADS_PUBLIC_OPERATOR }}
          HEADS_PUBLIC_SITE_URL: ${{ vars.HEADS_PUBLIC_SITE_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          HEADS_SENTRY_RETENTION_DAYS: ${{ vars.HEADS_SENTRY_RETENTION_DAYS }}
        run: |
          node public-site/build.mjs
          cp public-site/index.html public-site/dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public-site/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
